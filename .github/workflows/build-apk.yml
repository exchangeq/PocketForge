name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一分支只保留最新一次构建，连续提交不会排队堆一堆旧任务
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.PF_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > keystore/pocketforge.jks
            test -s keystore/pocketforge.jks
            echo "keystore restored"
          else
            echo "::warning::PF_KEYSTORE_BASE64 未配置，release 将退回 debug 签名"
          fi

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Build release APK
        env:
          PF_KEYSTORE_PASSWORD: ${{ secrets.PF_KEYSTORE_PASSWORD }}
          PF_KEY_PASSWORD: ${{ secrets.PF_KEY_PASSWORD }}
          PF_KEY_ALIAS: ${{ secrets.PF_KEY_ALIAS }}
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Verify release signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Collect APKs
        run: |
          mkdir -p out
          find app/build/outputs/apk -name "*.apk" -print
          cp app/build/outputs/apk/debug/app-debug.apk out/PocketForge-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/PocketForge-release.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: PocketForge-apk
          path: out/*.apk
          retention-days: 30
          if-no-files-found: error
