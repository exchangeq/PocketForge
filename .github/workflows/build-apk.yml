name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Build release APK
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p out
          find app/build/outputs/apk -name "*.apk" -print
          cp app/build/outputs/apk/debug/app-debug.apk out/PocketForge-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/PocketForge-release.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: PocketForge-apk
          path: out/*.apk
          retention-days: 30
          if-no-files-found: error
